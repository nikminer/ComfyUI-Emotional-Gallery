name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pillow aiohttp
      - run: python -m unittest discover -s tests -v
      - run: node --check web/gallery.js && node --check web/launcher.js && node --check web/locale.js && node --check web/triggers.js
      - run: node tests/test_locale.mjs
      - run: node tests/test_trigger_picker.mjs
